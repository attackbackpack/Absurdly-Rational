media:
  - name: uploads
    label: Uploaded images
    input: assets/uploads
    output: /assets/uploads
    extensions: [jpg, jpeg, png, webp]
    rename: safe
    commit:
      templates:
        create: "chore(media): add {filename}"
        update: "chore(media): update {filename}"
        delete: "chore(media): remove {filename}"
        rename: "chore(media): rename {oldFilename} -> {newFilename}"
    actions:
      - name: optimize-images
        label: Optimize uploaded images
        workflow: pages-cms-optimize-images.yml
        ref: current
        cancelable: false

components:
  seo:
    type: object
    label: Search and social text
    fields:
      - name: title
        label: Page title
        type: string
        required: true
        description: The browser title and primary search-result title.
        options:
          maxlength: 160
      - name: description
        label: Search description
        type: text
        required: true
        description: A truthful one- or two-sentence description of this page.
        options:
          maxlength: 320
      - name: og_title
        label: Social title
        type: string
        required: true
        description: The title shown when this page is shared.
        options:
          maxlength: 160
      - name: og_description
        label: Social description
        type: text
        required: true
        description: The description shown when this page is shared.
        options:
          maxlength: 320
      - name: twitter_description
        label: X/Twitter description
        type: text
        required: true
        description: A concise version for social cards.
        options:
          maxlength: 280

  image:
    type: object
    label: Image
    fields:
      - name: path
        label: Image file
        type: image
        description: Choose an uploaded image. Leave blank to keep the built-in geometric artwork.
        options:
          media: uploads
          extensions: [jpg, jpeg, png, webp]
          rename: safe
      - name: alt
        label: Alternative text
        type: string
        description: Describe a meaningful image. Leave blank only when the image is decorative beside visible text.
        options:
          maxlength: 160
      - name: decorative
        label: Decorative image
        type: boolean
        default: false
        description: Turn on only when nearby text already communicates the image's meaning.
      - name: fit
        label: Image fit
        type: select
        required: true
        description: Cover fills the frame and crops; contain shows the complete image.
        options:
          values:
            - name: cover
              label: Fill frame (crop)
            - name: contain
              label: Show complete image
      - name: focus
        label: Crop focus
        type: select
        required: true
        description: Choose the part to preserve when fit is set to cover.
        options:
          values:
            - name: center
              label: Center
            - name: top
              label: Top
            - name: bottom
              label: Bottom
            - name: left
              label: Left
            - name: right
              label: Right
            - name: top-left
              label: Top left
            - name: top-right
              label: Top right
            - name: bottom-left
              label: Bottom left
            - name: bottom-right
              label: Bottom right

  source_note:
    type: object
    label: Source note
    fields:
      - name: index_title
        label: Index note title
        type: string
        required: true
      - name: index_description
        label: Index note description
        type: text
        required: true
      - name: topic_title
        label: Topic note title
        type: string
        required: true
      - name: topic_description
        label: Topic note description
        type: text
        required: true
      - name: archive_label
        label: Archive link label
        type: string
        required: true
      - name: topic_archive_label
        label: Topic archive link label
        type: string
        required: true

  meme_art:
    type: object
    label: Built-in meme artwork text
    fields:
      - name: kicker
        label: Small top line
        type: string
        description: Optional short line above the main meme text.
      - name: headline
        label: Main meme text
        type: text
        required: true
        description: Use line breaks to control the built-in artwork layout.
      - name: accent
        label: Accent line
        type: text
        description: Optional small line below the main meme text.
      - name: stamp
        label: Stamp
        type: string
        description: Optional outlined stamp such as CITED or CITE.

content:
  - name: site_and_homepage
    label: Site & homepage
    type: group
    items:
      - name: site
        label: Site settings and homepage
        type: file
        path: _data/site.json
        format: json
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: name
            label: Site name
            type: string
            required: true
            readonly: true
          - name: url
            label: Site URL
            type: string
            required: true
            readonly: true
          - name: author
            label: Author
            type: object
            readonly: true
            fields:
              - name: name
                type: string
              - name: linkedin
                type: string
          - name: theme_color
            label: Theme color
            type: string
            readonly: true
          - name: brand_image
            label: Brand mark
            component: image
            readonly: true
          - name: navigation
            label: Navigation
            type: object
            readonly: true
            list:
              collapsible: false
            fields:
              - name: key
                type: string
              - name: label
                type: string
              - name: url
                type: string
          - name: footer
            label: Footer
            type: object
            fields:
              - name: note
                label: Footer note
                type: string
                required: true
              - name: contact_label
                label: Contact link label
                type: string
                required: true
          - name: home
            label: Homepage content
            type: object
            fields:
              - name: seo
                component: seo
              - name: hero
                label: Hero
                type: object
                fields:
                  - name: title_line_one
                    label: First title line
                    type: string
                    required: true
                  - name: title_line_two
                    label: Second title line
                    type: string
                    required: true
                  - name: thesis
                    label: Hero thesis
                    type: string
                    required: true
                  - name: description
                    label: Hero description
                    type: text
                    required: true
                  - name: cta_label
                    label: Button label
                    type: string
                    required: true
                  - name: cta_url
                    label: Button destination
                    type: string
                    readonly: true
                  - name: image
                    label: Optional hero image
                    component: image
              - name: formats_intro
                label: Format switchboard intro
                type: object
                fields:
                  - name: title
                    type: string
                    required: true
                  - name: description
                    type: text
                    required: true
              - name: formats
                label: Format doors
                type: object
                list:
                  min: 3
                  max: 3
                  collapsible:
                    collapsed: true
                    summary: "{title}"
                fields:
                  - name: key
                    type: string
                    readonly: true
                  - name: class_name
                    type: string
                    readonly: true
                  - name: title
                    type: string
                    required: true
                  - name: description
                    type: text
                    required: true
                  - name: meta
                    type: string
                    required: true
                  - name: url
                    type: string
                    readonly: true
                  - name: image
                    label: Optional door image
                    component: image
              - name: context
                label: Homepage context
                type: object
                fields:
                  - name: title
                    type: string
                    required: true
                  - name: description
                    type: text
                    required: true
                  - name: aside
                    label: Aside text
                    type: text
                    required: true
                  - name: contact_label
                    label: Contact link label
                    type: string
                    required: true

  - name: readings
    label: Readings
    type: group
    items:
      - name: readings_content
        label: Topics and posts
        type: file
        path: _data/readings.json
        format: json
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: page
            label: Readings page
            type: object
            fields:
              - name: seo
                component: seo
              - name: title
                type: string
                required: true
              - name: lede
                type: text
                required: true
              - name: back_label
                type: string
                required: true
              - name: topic_switcher_label
                type: string
                required: true
              - name: post_cta_label
                type: string
                required: true
              - name: topic_index_aria
                label: Topic index accessible label
                type: string
                required: true
              - name: archive_url
                label: Substack archive URL
                type: string
                required: true
                readonly: true
              - name: source_note
                component: source_note
          - name: topics
            label: Reading topics
            type: object
            list:
              min: 4
              max: 4
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: slug
                type: string
                readonly: true
              - name: order
                type: number
                required: true
                options:
                  min: 1
                  max: 4
              - name: class_name
                type: string
                readonly: true
              - name: path
                type: string
                readonly: true
              - name: title
                type: string
                required: true
              - name: short_title
                label: Short navigation label
                type: string
                required: true
              - name: description
                type: text
                required: true
              - name: index_label
                label: Index metadata label
                type: string
                required: true
              - name: aria_label
                label: Accessible post-list label
                type: string
                required: true
              - name: seo
                component: seo
          - name: posts
            label: Reading posts
            type: object
            list:
              max: 200
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: category
                label: Topic
                type: select
                required: true
                options:
                  values:
                    - name: evidence
                      label: Evidence vs. Hype
                    - name: policy
                      label: When Policy Meets Practice
                    - name: thinking
                      label: Critical Thinking
                    - name: hospital
                      label: Hospital Life
              - name: date
                type: date
                required: true
                options:
                  time: false
                  format: yyyy-MM-dd
              - name: title
                type: string
                required: true
              - name: subtitle
                type: text
                required: true
              - name: url
                label: Original Substack URL
                type: string
                required: true
                pattern:
                  regex: '^https://'
                  message: Use the full HTTPS URL for the original post.
              - name: visible
                label: Show on site
                type: boolean
                default: true
              - name: image
                label: Thumbnail image
                component: image

  - name: podcasts
    label: Podcasts
    type: group
    items:
      - name: podcast_content
        label: Podcast page and guests
        type: file
        path: _data/podcasts.json
        format: json
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: page
            label: Podcast page
            type: object
            fields:
              - name: seo
                component: seo
              - name: title
                type: string
                required: true
              - name: lede
                type: text
                required: true
              - name: show
                label: Home show
                type: object
                fields:
                  - name: title
                    type: string
                    required: true
                  - name: description
                    type: text
                    required: true
                  - name: meta
                    type: string
                    required: true
                  - name: label
                    label: Artwork label
                    type: string
                  - name: button_label
                    type: string
                    required: true
                  - name: url
                    type: string
                    required: true
                    pattern:
                      regex: '^https://'
                      message: Use the full HTTPS Spotify URL.
                  - name: new_tab
                    type: boolean
                    default: true
                  - name: image
                    label: Optional show image
                    component: image
              - name: guests_heading
                type: string
                required: true
              - name: guests_description
                type: text
                required: true
              - name: invite
                label: Invitation
                type: object
                fields:
                  - name: title
                    type: string
                    required: true
                  - name: description
                    type: text
                    required: true
                  - name: button_label
                    type: string
                    required: true
                  - name: url
                    type: string
                    required: true
                    pattern:
                      regex: '^https://'
                      message: Use the full HTTPS contact URL.
                  - name: new_tab
                    type: boolean
                    default: true
          - name: guests
            label: Guest appearances
            type: object
            list:
              max: 50
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: key
                type: string
                readonly: true
              - name: class_name
                label: Card artwork style
                type: select
                required: true
                options:
                  values:
                    - name: stanford
                      label: Stanford
                    - name: architect
                      label: Health Architect
              - name: title
                type: string
                required: true
              - name: description
                type: text
                required: true
              - name: meta
                type: string
                required: true
              - name: visible
                label: Show on site
                type: boolean
                default: true
              - name: art_label
                label: Built-in art label
                type: string
              - name: image
                label: Optional guest image
                component: image
              - name: links
                label: Guest links
                type: object
                list:
                  min: 1
                  max: 4
                  collapsible:
                    collapsed: true
                    summary: "{label}"
                fields:
                  - name: label
                    type: string
                    required: true
                  - name: url
                    type: string
                    required: true
                    pattern:
                      regex: '^https://'
                      message: Use a full verified HTTPS URL.
                  - name: new_tab
                    type: boolean
                    default: true
                  - name: arrow
                    type: boolean
                    default: true

  - name: meme_bank
    label: Meme bank
    type: group
    items:
      - name: meme_content
        label: Meme bank content
        type: file
        path: _data/memes.json
        format: json
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: page
            label: Meme page
            type: object
            fields:
              - name: seo
                component: seo
              - name: title
                type: string
                required: true
              - name: lede
                type: text
                required: true
              - name: tile_action_label
                type: string
                required: true
              - name: dialog_title
                type: string
                required: true
              - name: dialog_close_label
                type: string
                required: true
              - name: dialog_previous_label
                type: string
                required: true
              - name: dialog_next_label
                type: string
                required: true
              - name: dialog_navigation_label
                type: string
                required: true
              - name: starter_note_aria
                label: Starter note accessible label
                type: string
                required: true
              - name: wall_aria
                label: Meme wall accessible label
                type: string
                required: true
              - name: starter_note
                label: Starter-set note
                type: object
                fields:
                  - name: label
                    type: string
                    required: true
                  - name: description
                    type: text
                    required: true
          - name: items
            label: Meme items
            type: object
            list:
              max: 100
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: key
                type: string
                readonly: true
              - name: layout
                label: Tile layout
                type: select
                required: true
                description: Choose the tile footprint; the visual frame stays controlled by the site.
                options:
                  values:
                    - name: wide
                      label: Wide
                    - name: tall
                      label: Tall
                    - name: standard
                      label: Standard
                    - name: wide-low
                      label: Wide and short
                    - name: small
                      label: Small
              - name: variant
                label: Built-in art style
                type: select
                required: true
                description: Used only when no uploaded image is set.
                options:
                  values:
                    - name: rooster
                      label: Rooster
                    - name: big-reality
                      label: Big Reality
                    - name: receipts
                      label: Receipts
                    - name: conflicts
                      label: Conflicts
                    - name: snake-oil
                      label: Snake oil
                    - name: read-less
                      label: Read less
              - name: title
                type: string
                required: true
              - name: aria_label
                label: Accessible open label
                type: string
                required: true
              - name: caption
                type: text
                required: true
              - name: visible
                label: Show on site
                type: boolean
                default: true
              - name: image
                label: Optional uploaded meme image
                component: image
              - name: art
                component: meme_art

settings:
  hide: true
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "content(create): {path}"
      update: "content(update): {path}"
      delete: "content(delete): {path}"
      rename: "content(rename): {oldPath} -> {newPath}"
