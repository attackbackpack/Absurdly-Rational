name: Validate editable content

on:
  push:
    paths:
      - "_data/**"
      - "assets/uploads/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "_includes/**"
      - "editor/**"
      - "worker/**"
  pull_request:
    paths:
      - "_data/**"
      - "assets/uploads/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "_includes/**"
      - "editor/**"
      - "worker/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install validation dependencies
        run: npm ci
      - name: Validate editable content
        run: npm run check
