name: Deploy site with draft preview

on:
  push:
    branches:
      - main
      - editor
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production source from main
        uses: actions/checkout@v6
        with:
          ref: main
          path: production
          fetch-depth: 1

      - name: Check out main as the preview fallback
        uses: actions/checkout@v6
        with:
          ref: main
          path: preview
          fetch-depth: 1

      - name: Use editor for the preview when it exists
        working-directory: preview
        shell: bash
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --heads origin editor >/dev/null 2>&1; then
            git fetch --no-tags --depth=1 origin refs/heads/editor
            git checkout --detach FETCH_HEAD
            echo "Using editor branch for the draft preview."
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              echo "Unable to determine whether the editor branch exists." >&2
              exit "$status"
            fi
            echo "The editor branch does not exist; using main for the draft preview."
          fi

      - name: Configure draft preview settings at runner time
        shell: bash
        run: |
          set -euo pipefail
          printf '\n# Generated at build time for the editor preview.\nbaseurl: /preview\npreview: true\n' >> preview/_config.yml
          find preview -type f -name CNAME -delete

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build production from main
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./production
          destination: ./_site

      - name: Build the draft preview
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./preview
          destination: ./_preview-site

      - name: Assemble the single Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          # actions/jekyll-build-pages@v1 runs inside a Docker container as root,
          # so _site and _preview-site come out root-owned. This step runs as the
          # unprivileged runner user, so take ownership before touching them.
          sudo chown -R "$(id -u):$(id -g)" _site _preview-site
          mkdir -p _site/preview
          cp -R _preview-site/. _site/preview/
          rm -f _site/preview/CNAME _site/preview/robots.txt _site/preview/sitemap.xml
          # The preview is built from the editor branch — content the editor
          # itself wrote. Publishing the editor from there would give a second,
          # working, same-origin editor at /preview/editor/, built from its own
          # output and outside the robots.txt deleted just above. The canonical
          # editor is the one built from main at /editor/.
          rm -rf _site/preview/editor

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
